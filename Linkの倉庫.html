<!--箇条書きでブラウザ上に表示するプログラム
<div class="container_1">
    <ul id="list">
    <script>
        var link = [];
        link[0] = "年";
        link[1] = "月";
        link[2] = "日";
        for (var i=0; i<link.length; i++){/*変数iを0から配列linkの長さまでforループ*/
            var link_a = document.createElement('li');/*liタグを作成、link_aに代入*/
            link_a.textContent = link[i];/*link_aのテキスト内容としてlink[i]の内容を代入*/
            document.getElementById('list').appendChild(link_a);/*listって名前のulタグの要素を取得する。.←で取得した要素の子要素として変数link_aを挿入*/
        }
    </script>
    </ul>
</div>
